# MUnit test fixtures for the webcrawler connector.
#
# remote.browser.url -- W3C Remote WebDriver endpoint used by the Remote WebDriver fetch suites.
# The default below is a placeholder; CI / contributors must override with -Dremote.browser.url
# pointing at their own reachable endpoint (Selenium Grid, BrowserStack, CloudHub remote-browser, etc.)
# or skip the Remote WebDriver suites entirely. We do not check in real workspace URLs because
# this property file ships in the open-source repo.
remote.browser.url=https://remote-browser.example.invalid

# Public fixtures the suites point at. Stable, deterministic URLs that don't require a localhost
# MockWebServer (a remote WebDriver endpoint cannot reach localhost).
test.url.static=https://example.com
test.url.links=https://httpbin.org/links/3/0
